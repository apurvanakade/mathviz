# The second fixture site for scripts/check-layout.mjs: a site that sets no
# project `mathviz:` at all and turns pieces on page by page with
# `mathviz-page:` alone (fixtures/layout/ always has project options, so it
# could not see a page option dropped when they are absent). Its one page is
# a blog-style index: a custom-template listing with a category cloud. Not
# published. The script copies _extensions/mathviz in before rendering (that
# copy is gitignored).
project:
  type: website
  output-dir: _site

filters:
  - mathviz

website:
  title: "mathviz page-option fixture"

format:
  html:
    theme:
      light: [_extensions/mathviz/theme/mathviz-light.scss]
      dark: [_extensions/mathviz/theme/mathviz-dark.scss]
