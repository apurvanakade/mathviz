# Opens a release pull request. scripts/release.mjs sets the version in the
# three files the build checks, moves CHANGELOG.md's [Unreleased] under the
# new version and bumps the install snippets; this workflow rebuilds, tests,
# and opens the PR on release/vX.Y.Z.
#
# The PR lands like any other (the land-pr skill), and nothing merges itself.
# When it reaches main, tag-release.yml sees the new version and tags it.
#
# The branch is pushed and the PR opened with RELEASE_TOKEN, a fine-grained
# personal access token (Contents and Pull requests: read and write on this
# repository), not the built-in GITHUB_TOKEN. A PR opened with GITHUB_TOKEN
# gets no ordinary CI: its pull_request run waits for a manual approval, and
# a run started any other way doesn't count as the PR's required `check`
# (v0.1.12 needed the approval by hand). Opened with the token, the PR is
# yours and CI runs as on any other.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, major.minor.patch (e.g. 0.1.12)"
        required: true
        type: string

# The pushes and the PR go through RELEASE_TOKEN; GITHUB_TOKEN only reads.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check that RELEASE_TOKEN is set
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Add a RELEASE_TOKEN repository secret (see the header of release.yml)."
            exit 1
          fi

      # The token given here is the one checkout leaves configured for
      # `git push` below.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Through an env var, not interpolated into the script: a dispatch
      # input is arbitrary text, and release.mjs can only validate what
      # reaches it.
      - name: Set the version, CHANGELOG and install snippets
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release.mjs "$VERSION"

      # The bundle banner and the starter mirror carry the version, so the
      # release commit includes the rebuilt copies or CI's freshness gate
      # fails on the PR.
      - run: npm run build
      - run: npm test

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Release v$VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Release v$VERSION" \
            --body "Sets the version to $VERSION, moves the [Unreleased] CHANGELOG entries under it and bumps the install snippets. tag-release.yml tags v$VERSION when this merges."
