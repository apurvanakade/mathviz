# Tells the sites that vendor this extension that a new release exists.
# On every v* tag push it sends a `repository_dispatch` to VisualMathLab,
# whose .github/workflows/update-mathviz.yml then runs `quarto update` to
# the newest tag and commits the result to its develop branch.
#
# One-time setup: create a fine-grained personal access token scoped to the
# apurvanakade/VisualMathLab repository with Contents: read and write (that
# is the permission the dispatches endpoint checks), and store it in THIS
# repo's Settings -> Secrets and variables -> Actions as
# VISUALMATHLAB_DISPATCH_TOKEN. The default GITHUB_TOKEN can't be used: it
# is scoped to this repository only.

name: Notify consumers of a release

on:
  push:
    tags:
      - "v*"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to VisualMathLab
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.VISUALMATHLAB_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/apurvanakade/VisualMathLab/dispatches \
            -d '{"event_type":"mathviz-release","client_payload":{"tag":"${{ github.ref_name }}"}}'
