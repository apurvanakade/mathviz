# Tags whatever version main currently declares, so other sites can pin it
# with `quarto add apurvanakade/mathviz@vX.Y.Z` (and consumers tracking the
# latest tag pick it up on their next render).
#
# Runs on its own when a push to main changes package.json -- in practice,
# when a release PR opened by release.yml merges -- and does nothing if that
# version is already tagged. Run it by hand to tag a version that landed
# some other way; then an existing tag is an error.
#
# So: run "Release" -> land its PR -> this tags it.

name: Tag release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a push, the commit that bumped the version -- not whatever
          # main has moved on to by the time this job starts.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Tag the version main declares
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"

          # build.mjs refuses to build unless package.json, _extension.yml and
          # mathviz.lua agree, so running it is also the check that the tag
          # about to be cut names the version the filter will report.
          npm ci
          npm run build
          git diff --exit-code \
            || { echo "::error::main is not built: dist/ differs from src/. The change that landed it skipped `npm run build`."; exit 1; }

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "$tag already exists; package.json changed without a version bump."
              exit 0
            fi
            echo "::error::$tag already exists. Run the Release workflow to bump the version first."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "mathviz $tag"
          git push origin "$tag"
          echo "Tagged $tag at $(git rev-parse --short HEAD)."
