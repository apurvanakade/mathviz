# The documentation site (docs/**), rendered through the extension in place
# -- this file sits next to _extensions/, so every docs page exercises the
# real filter with no install step, and `quarto render` doubles as CI's
# smoke test. Output goes to _site/ (gitignored); .github/workflows/docs.yml
# publishes it to the gh-pages branch. starter/ is a separate Quarto
# project (its own _quarto.yml) and is not part of this one.
project:
  type: website
  output-dir: _site
  # An explicit allowlist, not "everything renderable": without it Quarto
  # compiles README.md, CLAUDE.md, CONTRIBUTING.md and starter/ into site
  # pages too. docs/index.qmd first: Quarto redirects the site root to
  # whichever file the list renders first.
  render:
    - docs/index.qmd
    - "docs/**/*.qmd"

filters:
  - mathviz
mathviz:
  referrer: same-origin

execute:
  # The docs show their code by default; a cell that is plumbing rather
  # than example (the vmTheme/chartColors pair, say) opts out with
  # `//| echo: false`.
  echo: true
  warning: false

website:
  title: mathviz
  site-url: https://apurvanakade.github.io/mathviz/
  repo-url: https://github.com/apurvanakade/mathviz
  repo-actions: [issue]
  navbar:
    left:
      - text: Guide
        href: docs/index.qmd
      - text: Reference
        href: docs/reference/index.qmd
      - text: Starter
        href: https://github.com/apurvanakade/mathviz/tree/main/starter
    right:
      - icon: github
        href: https://github.com/apurvanakade/mathviz
  sidebar:
    - id: guide
      title: Guide
      style: docked
      contents:
        - docs/index.qmd
        - docs/first-chart.qmd
        - docs/theming.qmd
        - docs/markup.qmd
        - docs/install.qmd
        - docs/troubleshooting.qmd
    - id: reference
      title: Reference
      style: docked
      contents:
        - docs/reference/index.qmd
        - docs/reference/expressions.qmd
        - docs/reference/numerical.qmd
        - docs/reference/sampling.qmd
        - docs/reference/filters.qmd
        - docs/reference/distributions.qmd
        - docs/reference/plotting.qmd
        - docs/reference/ui.qmd
        - docs/reference/discrete-math.qmd
        - docs/reference/internals.qmd
  page-footer:
    left: "Apache-2.0 · Copyright (c) 2026 Apurva Nakade"

format:
  html:
    # A light/dark pair so the toggle exists -- following it is what half
    # of this library is about.
    theme:
      light: cosmo
      dark: superhero
    toc: true
    toc-depth: 3
    code-copy: true
    html-math-method: katex
